# Supabase (plan gratis) pausa los proyectos que pasan una semana sin actividad.
# Este aviso automático pide un dato público cada 3 días para que no se pause durante la prueba.
# Si falla (no responde 200), GitHub avisa por correo a quien administra el repositorio.
name: Mantener activo Supabase
on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir un dato al proyecto
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" "https://kyowmixxdoiohzmfvhpf.supabase.co/rest/v1/rumbo_feedback?select=id&limit=1" -H "apikey: sb_publishable_m5A6ucgIWhujD-uSGLMFjw_ChYJaM3t")
          echo "Respuesta de Supabase: $codigo"
          test "$codigo" = "200"
