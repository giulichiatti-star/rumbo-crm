<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="app-version" content="20261031-224740">
<title>Rumbo · recría y engorde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ee;--ink:#12161f;--mut:#6a7080;--line:#e3e1d7;--lime:#d4f46a;--card:#fff;--red:#f0452b;--amber:#f2a516;--blue:#2f8cff;--green:#15b374;
 --sh:0 1px 0 rgba(18,22,31,.04),0 12px 32px rgba(18,22,31,.08)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.i{vertical-align:-4px;flex:none}
/* cabecera */
header{display:grid;grid-template-columns:1fr minmax(320px,640px) 1fr;gap:20px;align-items:center;padding:20px 32px 8px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:26px;letter-spacing:-1px}
.logo i{width:38px;height:38px;border-radius:12px;background:var(--ink);color:var(--lime);display:grid;place-items:center;transform:rotate(-8deg)}
.cmd{position:relative}
.cmd input{width:100%;height:54px;border:0;border-radius:99px;padding:0 70px 0 54px;background:#fff;box-shadow:var(--sh);outline:none;font-size:16px;font-weight:600}
.cmd input:focus{box-shadow:0 0 0 3px var(--lime),var(--sh)}
.cmd .si{position:absolute;left:20px;top:15px;color:var(--mut)}
.cmd kbd{position:absolute;right:18px;top:15px;background:var(--bg);border-radius:8px;padding:2px 9px;font:700 12px 'Manrope';color:var(--mut)}
.res{position:absolute;top:62px;left:0;right:0;background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(18,22,31,.2);padding:8px;z-index:30;display:none;max-height:60vh;overflow:auto}
.res.on{display:block}
.res h6{margin:8px 12px 4px;font:700 11px 'Manrope';text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.res button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:9px 12px;border-radius:14px;font-weight:600}
.res button.sel,.res button:hover{background:var(--lime)}
.res .tag{margin-left:auto;font-size:12px;color:var(--mut);font-weight:600}
.hr{display:flex;justify-content:flex-end;align-items:center;gap:12px}
.bellb{position:relative;width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:var(--sh);display:grid;place-items:center}
.bellb b{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-weight:800}
/* modos */
.modes{display:flex;justify-content:center;margin:14px 0 22px}
.seg{display:inline-flex;background:#fff;border-radius:99px;padding:5px;box-shadow:var(--sh);gap:2px}
.seg button{display:flex;gap:8px;align-items:center;border:0;background:none;border-radius:99px;padding:10px 24px;font-weight:700;color:var(--mut);transition:.2s}
.seg button.on{background:var(--ink);color:#fff}
main{padding:0 32px 120px;max-width:1360px;margin:0 auto}
.fade{animation:fade .45s cubic-bezier(.2,.8,.3,1) both}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}
h1{font:800 clamp(30px,4vw,46px)/1.05 'Manrope';letter-spacing:-1.8px;margin:0 0 6px}
h2{font:800 20px 'Manrope';letter-spacing:-.5px;margin:0 0 12px}
.sub{color:var(--mut);margin:0 0 22px}
.btn{border:0;border-radius:99px;padding:10px 20px;font-weight:700;background:#fff;box-shadow:0 1px 0 rgba(18,22,31,.08),0 0 0 1.5px var(--line) inset;transition:.15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(18,22,31,.12),0 0 0 1.5px var(--ink) inset}
.btn.pri{background:var(--ink);color:#fff;box-shadow:none}
.btn.lime{background:var(--lime);box-shadow:none}
.btn.sm{padding:5px 14px;font-size:13px}
.chip{border:0;background:#fff;border-radius:99px;padding:6px 16px;font-weight:700;font-size:13px;box-shadow:0 0 0 1.5px var(--line) inset}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
/* HOY */
.hoy{display:grid;grid-template-columns:1.15fr 1fr;gap:36px;align-items:start}
.deck{position:relative;height:430px;margin-top:6px}
.acard{position:absolute;inset:0 0 auto 0;height:380px;background:#fff;border-radius:34px;box-shadow:var(--sh);padding:30px;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;transition:transform .35s cubic-bezier(.2,.8,.3,1),opacity .3s}
.acard.top{cursor:grab;z-index:3}
.acard.top:active{cursor:grabbing}
.acard.s1{transform:translateY(16px) scale(.96);z-index:2;opacity:.9}
.acard.s2{transform:translateY(32px) scale(.92);z-index:1;opacity:.7}
.acard.nodrag{transition:none}
.ab{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;color:#fff!important;margin-bottom:18px}
.ab.crit{background:var(--red)}.ab.warn{background:var(--amber)}.ab.info{background:var(--blue)}
.acard .who{font:700 13px 'Manrope';text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.acard .tt{font:800 27px/1.2 'Manrope';letter-spacing:-.8px;margin:6px 0 0;flex:1}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.hint{text-align:center;color:var(--mut);font-size:13px;font-weight:600;margin-top:6px}
.done-card{height:380px;border-radius:34px;background:var(--lime);display:grid;place-items:center;text-align:center;padding:30px}
.done-card h2{font-size:34px;letter-spacing:-1.2px}
.prog{display:flex;align-items:center;gap:14px;margin-bottom:12px;font-weight:700}
.prog .bar{flex:1;height:10px;border-radius:99px;background:#e6e4d8;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .4s}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:26px}
.tile{border:0;text-align:left;background:#fff;border-radius:24px;padding:14px 16px;box-shadow:var(--sh);transition:.2s}
.tile:hover{transform:translateY(-4px)}
.tile small{display:block;color:var(--mut);font-weight:700;font-size:12px}
.tile b{display:block;font:800 24px/1.1 'Manrope';letter-spacing:-1px;margin:4px 0}
.tile svg.sp{width:100%;height:30px}
.tasks{background:#fff;border-radius:26px;box-shadow:var(--sh);padding:8px}
.task{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:16px}
.task:hover{background:var(--bg)}
.task .tx{flex:1;font-weight:600}
.task small{display:block;color:var(--mut);font-weight:500}
.cb{appearance:none;width:24px;height:24px;border-radius:50%;border:2px solid #c9c7bb;background:#fff;position:relative;flex:none}
.cb:checked{background:var(--ink);border-color:var(--ink)}
.cb:checked::after{content:"";position:absolute;left:7px;top:2px;width:6px;height:11px;border:solid var(--lime);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.task.dn .tx{text-decoration:line-through;color:var(--mut)}
/* CICLO */
.gantt{background:#fff;border-radius:30px;box-shadow:var(--sh);overflow:auto;position:relative}
.gantin{position:relative;min-width:max-content}
.th{display:flex;position:sticky;top:0;z-index:4;background:#fff;border-bottom:1.5px solid var(--line)}
.lab{width:230px;flex:none;position:sticky;left:0;background:#fff;z-index:5;padding:10px 18px;border-right:1.5px solid var(--line)}
.mo{width:88px;flex:none;text-align:center;padding:10px 0;font-weight:700;font-size:13px;color:var(--mut);border-right:1px dashed var(--line)}
.mo i{display:block;font-style:normal;font-size:11px;color:#a7a99f;font-weight:600}
.mo.now{background:var(--lime);color:var(--ink)}
.row{display:flex;height:64px;border-bottom:1px solid var(--line);position:relative}
.row .lab{display:flex;flex-direction:column;justify-content:center;line-height:1.25;font-weight:700;font-size:14px}
.row .lab small{color:var(--mut);font-weight:500}
.cells{position:relative;display:flex}
.cells .mo{border:0;border-right:1px dashed #efede4;padding:0}
.bar2{position:absolute;top:11px;height:42px;border-radius:99px;color:#fff;display:flex;align-items:center;gap:8px;padding:0 16px;font-weight:700;font-size:13px;white-space:nowrap;cursor:grab;box-shadow:0 6px 14px rgba(18,22,31,.18);touch-action:none;user-select:none;transition:box-shadow .15s}
.bar2:hover{box-shadow:0 10px 22px rgba(18,22,31,.28)}
.bar2.neg{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 8px,transparent 8px 16px)}
.bar2.drag{cursor:grabbing;z-index:6;opacity:.92}
.bar2 em{font-style:normal;background:rgba(255,255,255,.28);border-radius:99px;padding:1px 9px;margin-left:auto}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:3;pointer-events:none}
.nowline::before{content:"hoy";position:absolute;top:2px;left:4px;background:var(--red);color:#fff;border-radius:6px;padding:0 6px;font-size:11px;font-weight:800}
.fr{display:flex;height:34px;border-bottom:1.5px solid var(--line);background:#faf9f4}
.fr .lab{padding:6px 18px;font-size:12px;font-weight:700;color:var(--mut)}
.fc{width:88px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin:14px 4px;color:var(--mut);font-size:13px;font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:22px;height:12px;border-radius:99px;display:inline-block}
/* GENTE */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.pc{background:#fff;border-radius:28px;box-shadow:var(--sh);padding:20px;border:0;text-align:left;transition:.2s;position:relative;overflow:hidden}
.pc:hover{transform:translateY(-5px) rotate(-.5deg)}
.pc .av{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:17px;margin-bottom:12px}
.pc b{display:block;font:800 18px/1.2 'Manrope';letter-spacing:-.4px}
.pc small{color:var(--mut);font-weight:600}
.step{display:flex;gap:4px;margin:12px 0}
.step i{flex:1;height:6px;border-radius:99px;background:#e9e7dc}
.step i.on{background:var(--ink)}
.lchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.lc{border-radius:99px;color:#fff;font-weight:700;font-size:12px;padding:3px 11px}
.warnb{position:absolute;top:16px;right:16px;background:var(--red);color:#fff;border-radius:99px;font-size:12px;font-weight:800;padding:2px 10px}
/* panel lateral */
.ov{position:fixed;inset:0;background:rgba(18,22,31,.35);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.ov.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:12px;bottom:12px;right:12px;width:min(480px,calc(100% - 24px));background:#fff;border-radius:34px;box-shadow:0 30px 80px rgba(18,22,31,.3);transform:translateX(110%);transition:transform .35s cubic-bezier(.2,.8,.3,1);z-index:41;overflow:auto;padding:28px}
.dr.on{transform:none}
.dr h3{font:800 28px/1.1 'Manrope';letter-spacing:-1px;margin:6px 0}
.x{float:right;width:38px;height:38px;border-radius:50%;border:0;background:var(--bg);font-size:18px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.kv div{background:var(--bg);border-radius:18px;padding:12px 14px}
.kv small{display:block;color:var(--mut);font-weight:600;font-size:12px}
.kv b{font:800 20px 'Manrope';letter-spacing:-.6px}
.ok{color:var(--green)}.crit{color:var(--red)}.warn{color:var(--amber)}
.sim{background:var(--lime);border-radius:24px;padding:16px;margin:12px 0}
.sim input[type=range]{width:100%;accent-color:var(--ink)}
.sim .out{font:800 30px 'Manrope';letter-spacing:-1px}
.nt{background:var(--bg);border-radius:16px;padding:10px 14px;margin-bottom:8px}
.nt small{color:var(--mut);display:block}
textarea,.inp{border:0;background:var(--bg);border-radius:14px;padding:10px 14px;outline:none}
textarea:focus,.inp:focus{box-shadow:0 0 0 2px var(--ink)}
/* chat */
.fab{position:fixed;right:24px;bottom:24px;width:62px;height:62px;border-radius:50%;border:0;background:var(--ink);color:var(--lime);display:grid;place-items:center;box-shadow:0 14px 30px rgba(18,22,31,.35);z-index:35;transition:.2s}
.fab:hover{transform:scale(1.08) rotate(-6deg)}
.fab b{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.chat{position:fixed;right:24px;bottom:100px;width:min(400px,calc(100% - 32px));height:min(560px,70vh);background:#fff;border-radius:30px;box-shadow:0 30px 80px rgba(18,22,31,.3);z-index:36;display:flex;flex-direction:column;overflow:hidden;transform:translateY(20px) scale(.96);opacity:0;pointer-events:none;transition:.25s}
.chat.on{transform:none;opacity:1;pointer-events:auto}
.ctabs{display:flex;gap:6px;padding:14px 14px 8px;overflow-x:auto}
.ctabs button{border:0;background:var(--bg);border-radius:99px;padding:6px 14px;font-weight:700;font-size:13px;white-space:nowrap;position:relative}
.ctabs button.on{background:var(--ink);color:#fff}
.ctabs button b{background:var(--red);color:#fff;border-radius:99px;font-size:10px;padding:0 6px;margin-left:6px}
#msgs{flex:1;overflow:auto;padding:8px 16px}
.m{max-width:85%;margin-bottom:10px}
.m .bub{background:var(--bg);border-radius:20px 20px 20px 6px;padding:9px 14px}
.m.me{margin-left:auto}.m.me .bub{background:var(--lime);border-radius:20px 20px 6px 20px}
.m small{color:var(--mut);font-weight:600;font-size:11px;margin:0 8px}
.chipref{display:inline-block;margin-top:6px;background:var(--ink);color:#fff;border-radius:99px;padding:2px 12px;font-size:12px;font-weight:700;border:0}
.cin{display:flex;gap:8px;padding:12px}
.cin input{min-width:0;flex:1;border:0;background:var(--bg);border-radius:99px;padding:11px 18px;outline:none}
.typ{height:18px;padding:0 20px;font-size:12px;color:var(--mut);font-weight:600}
/* toast + dialog */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;display:flex;flex-direction:column;gap:10px;z-index:60;align-items:center}
.toast{background:var(--ink);color:#fff;border-radius:99px;padding:12px 22px;font-weight:700;box-shadow:0 14px 30px rgba(18,22,31,.35);animation:fade .3s}
.toast span{color:var(--lime);margin-right:8px}
dialog{border:0;border-radius:30px;padding:26px;width:min(440px,94vw);box-shadow:0 30px 80px rgba(18,22,31,.35)}
dialog::backdrop{background:rgba(18,22,31,.45)}
dialog label{display:block;margin-bottom:12px;font-weight:700;font-size:13px}
dialog label .inp,dialog label select{margin-top:4px;font-weight:500}
dialog .r2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.empty{padding:40px;text-align:center;color:var(--mut)}
@media(max-width:900px){
 header{grid-template-columns:1fr auto;padding:14px 16px 4px}.cmd{grid-column:1/-1;grid-row:2}.hr{grid-column:2;grid-row:1}
 main{padding:0 16px 120px}.hoy{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr 1fr}
 .seg button{padding:9px 16px}.lab{width:130px}.deck{height:410px}.acard{height:360px;padding:22px}.acard .tt{font-size:22px}
 .cmd kbd{display:none}
}
/* ===== compatibilidad con las vistas del modelo ===== */
textarea,.inp{width:100%}select{width:auto;max-width:100%;border:0;background:var(--bg);border-radius:14px;padding:9px 14px;outline:none}
dialog label select,.dr form select{width:100%}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.bar .sp{flex:1}
.prog .bar{margin:0}
.note{background:#fff0c4;border-radius:16px;padding:10px 16px;font-size:13px;margin:0 0 18px;font-weight:600;color:#6d5410}
.sec{margin-top:32px}
.label{font-size:12px;font-weight:700;color:var(--mut)}
.tablewrap{background:#fff;border-radius:24px;box-shadow:var(--sh);overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font:700 12px Manrope;color:var(--mut);text-align:left;padding:12px 14px;border-bottom:2px solid var(--line);white-space:nowrap;background:#fbfaf5}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr[data-act]{cursor:pointer}tbody tr[data-act]:hover{background:#faf8ef}
td small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.num{text-align:right;white-space:nowrap}
.cc td input.inp{padding:5px 8px;width:auto}.cc td select{padding:4px 8px}
.stamp{display:inline-block;padding:2px 12px;border-radius:99px;font:700 11px Manrope;background:color-mix(in srgb,currentColor 14%,#fff);white-space:nowrap}
.s-Prospecto,.s-Planificado{color:var(--blue)}.s-Diagnóstico,.s-En-pasto{color:#b9800b}.s-Propuesta,.s-En-corral{color:#d2561a}
.s-Cliente-activo,.s-Listo{color:var(--green)}.s-Pausado,.s-Cerrado{color:#8b8f99}
.list{list-style:none;margin:0;padding:6px 6px;background:var(--bg);border-radius:22px}
.list li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px dashed #dcd9cb}
.list li:last-child{border:0}.list li .tx{flex:1;font-weight:600}.list li small{color:var(--mut);font-weight:500;display:block;font-size:12px}
.list li.done .tx{text-decoration:line-through;color:var(--mut)}
.list .cb{margin-top:2px}
.link{color:var(--ink);font-weight:700;text-decoration:underline;background:none;border:0;padding:0}
.link:hover{color:var(--red)}
.chart{width:100%;height:auto;display:block;background:#fff;border-radius:22px;box-shadow:var(--sh)}
.chart text{font:600 11px Manrope;fill:var(--mut)}.chart .gl{stroke:#eceae0;stroke-width:1}.chart .ax{stroke:#c9c7bb;stroke-width:1.5}.chart circle{stroke:#fff;stroke-width:2}
.legend i{height:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.grid2>div{background:var(--bg);border-radius:18px;padding:12px 14px}
.grid2 b{display:block;font:800 18px/1.25 Manrope;letter-spacing:-.4px}
.sim label{display:block;margin-bottom:10px}.sim .out{font:800 28px Manrope;letter-spacing:-1px}
.dr h2.big{font:800 28px/1.1 Manrope;letter-spacing:-1px;margin:6px 0 8px}
.dr dl{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;margin:16px 0}.dr dt{font-size:12px;color:var(--mut);font-weight:700;padding-top:3px}.dr dd{margin:0}
.dr .x{width:auto;height:auto;border-radius:99px;padding:7px 16px;font-size:13px;font-weight:700}
.dr h2{margin-top:18px}
.tl{border-left:2px solid var(--line);margin:8px 0 0 5px;padding-left:16px}.tl div{position:relative;padding-bottom:12px}
.tl div::before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;background:#fff;border:2px solid var(--ink);border-radius:50%}
.tl small{font-size:12px;color:var(--mut);display:block}
textarea.inp{min-height:60px;margin-top:6px}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:12px}
.kc{min-height:360px;background:#ece9dd;border-radius:26px;padding:14px}
.kc.s-Planificado{background:#e1eefb}.kc.s-En-pasto{background:#fdf0cc}.kc.s-En-corral{background:#fde2d6}.kc.s-Listo{background:#d9f2e4}
.kh{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 10px}.kh b{display:flex;gap:6px;align-items:center;font:800 15px Manrope}.kh span{font-size:12px;color:var(--mut);font-weight:600}
.kb{min-height:300px;padding:4px;margin:-4px;border-radius:14px}.kb.over{background:rgba(212,244,106,.45);outline:2px dashed var(--ink)}
.kcard{background:#fff;border-radius:18px;padding:12px 14px;margin-bottom:10px;cursor:grab;color:var(--ink);box-shadow:0 3px 0 rgba(18,22,31,.08),0 8px 16px rgba(18,22,31,.06);transition:.15s}
.kcard:hover{transform:translateY(-3px) rotate(-.5deg)}.kcard.drag{opacity:.35}.kcard b{display:block;font:800 15px Manrope}
.kcard .m{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:6px;color:var(--mut);font-weight:600}
.kcard .av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--lime);font-size:10px;font-weight:800}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:28px}
.ok{color:var(--green)}.crit{color:var(--red)}.warn{color:#c98a0a}
.segsub{display:inline-flex;gap:4px;background:#fff;border-radius:99px;padding:4px;box-shadow:var(--sh);margin-bottom:18px;flex-wrap:wrap}
.segsub button{border:0;background:none;border-radius:99px;padding:7px 18px;font-weight:700;color:var(--mut)}
.segsub button.on{background:var(--ink);color:#fff}
.best{background:#eaf9c8}
.pc .av{width:48px;height:48px}
.foot{text-align:center;margin-top:40px}.foot button{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:13px}
@media(max-width:900px){.cols{grid-template-columns:1fr}.dr dl{grid-template-columns:100px 1fr}.seg{max-width:100%;overflow-x:auto}}
.sync{font-size:12px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:6px;margin-right:4px}
.sync::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--green)}
.sync.bad::before{background:var(--red)}.sync.wait::before{background:var(--amber)}.sync:empty{display:none}
.login{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;place-items:center;padding:20px}
.login.on{display:grid}
.login form{background:#fff;border-radius:30px;box-shadow:0 30px 80px rgba(18,22,31,.2);padding:30px;width:min(420px,100%)}
.login label{display:block;margin-bottom:12px;font-weight:700;font-size:13px}.login label .inp{margin-top:4px;font-weight:500}
.lmsg{min-height:22px;font-size:13px;font-weight:600;color:var(--red);margin-bottom:8px}.lmsg.ok{color:var(--green)}
/* pantallas que cuadran: los textos largos y los botones se acomodan, nada sale de la ventana */
.bar label{display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:100%;min-width:0}
.bar select{max-width:100%;min-width:0}
.list li{flex-wrap:wrap}.list li .tx{flex:1 1 180px;min-width:0;overflow-wrap:anywhere}
dialog input,dialog select,dialog textarea{min-width:0;max-width:100%}dialog .r2>label{min-width:0}
.cin select{max-width:96px}
@media(max-width:480px){dialog .r2{grid-template-columns:1fr}}
.nueva{position:fixed;top:0;left:0;right:0;z-index:300;background:var(--ink);color:#fff;display:none;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 16px;box-shadow:0 8px 24px rgba(18,22,31,.3)}
.nueva.on{display:flex}.nueva div{display:flex;flex-direction:column;min-width:0;text-align:left}.nueva b{font-weight:800}.nueva span{font-size:13px;color:#cfd3dc}
.nueva-dentro{background:var(--ink);color:#fff;border-radius:16px;padding:10px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px}.nueva-dentro span{color:#cfd3dc;flex:1 1 160px}</style>

const cl=id=>S.clients.find(c=>c.id===id), lo=id=>S.lotes.find(l=>l.id===id);
const since=c=>c.ultimo==null?null:-diff(c.ultimo);
const log=x=>{S.log.unshift({t:Date.now(),x});S.log=S.log.slice(0,30)};
const colchon=l=>(l.pv-l.peq)/l.pv;
const mk=()=>{const r=S.mercado.slice().sort((a,b)=>a.f>b.f?1:-1);return r};
const derived=r=>({ratio:r.inv/r.gor,kgMaiz:r.gor*1000/r.maiz,kgSoja:r.gor*1000/r.soja,lGas:r.gor/r.gas,usd:r.gor/r.usd});
const activeClient=c=>c.etapa!=='Pausado';
const lotesDe=cid=>S.lotes.filter(l=>l.cid===cid);
const mAntes=l=>l.ingN-l.compra-l.desemb;
function realCalc(l){const r=l.real;if(!r)return null;const mod=lo(r.mod)||l;
  const dias=Math.max(1,diff(r.fe)-diff(r.fi)),gdpv=(r.pe-r.pi)/dias,mort=1-r.ce/r.ci;
  const compra=r.pc*r.pi*(1+COM_C)+FLETE_C,ingN=r.pv*r.pe*(1-DESB_V)*(1-COM_V);
  const mR=ingN*r.ce/r.ci-compra-(r.cd||0),mM=mAntes(mod);
  return {dias,gdpv,mort,compra,ingN,mR,mM,dif:mR-mM,mod,sob:!r.cd};}
const lastMk=()=>{const M=mk();return M[M.length-1]};
const recCalc=r=>{const amort=r.impl/Math.max(r.vida,1),usd=amort+r.mant+r.infra+r.tierra+r.conf+r.otros,pesos=usd*lastMk().usd,ms=r.rend*r.efic*(1-r.perd);return {amort,usd,pesos,ms,kg:ms>0?pesos/ms:0,sum:r.perfil.reduce((a,b)=>a+b,0)}};
const insPrice=i=>i.mkt?lastMk().maiz/1000:i.precio;
const insMS=i=>i.ms>0?insPrice(i)/i.ms:0;
const racCalc=r=>{let sum=0,cost=0,pb=0,em=0;r.pct.forEach((p,k)=>{const i=S.ins[k];sum+=p;cost+=p*insMS(i);pb+=p*i.pb;em+=p*i.em});return {sum,cost,pb,em}};
const bibBase=b=>{if(!b.src)return b.costo;const [t,i]=b.src.split('.');return t==='rec'?recCalc(S.rec[+i]).kg:racCalc(S.rac[+i]).cost};
const bibEf=b=>bibBase(b)/(1-b.merma);
const gdpvEf=(b,m,w)=>{const g=b.g[m];return g<=0?0:Math.max(g+b.dg*(w-b.pref)/100,b.gmin)};
function forrajeBal(){const r=S.rec[0];return S.fdem.map(([f,d])=>{const m=+f.slice(5,7)-1;return [f,r.ha*r.rend*(r.perfil[m]/100)*r.efic-d]})}
function haReq(){const r=S.rec[0];let mx=0;S.fdem.forEach(([f,d])=>{const m=+f.slice(5,7)-1,k=r.rend*(r.perfil[m]/100)*r.efic;if(d>0&&k>0)mx=Math.max(mx,d/k)});return mx}
function setPath(p,v){const k=p.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
const gi=(p,v,o={})=>o.s?`<input class="inp" style="width:${Math.max(o.w||170,Math.min(Math.round(String(v).length*8.4+32),480))}px" data-act="cset" data-p="${p}" data-s="1" value="${esc(v)}">`:`<input class="inp num" style="width:${o.w||78}px" type="number" step="any" data-act="cset" data-p="${p}" ${o.pc?'data-pc="1"':''} value="${o.pc?+(v*100).toFixed(2):v}">`;
function realDevs(){ // último mes medido por tipo de etapa vs. Biblioteca
  return BIB.map(b=>{const o=S.real[b.id]||{},ks=Object.keys(o).filter(k=>o[k]!==''&&o[k]!=null).map(Number);if(!ks.length)return null;
    const m=Math.max(...ks),v=+o[m],g=b.g[m];return g>0?{b,m,v,g,dev:v/g-1}:null}).filter(Boolean);}

/* ---------- alertas ---------- */
function alerts(){
  const out=[], M=mk(), last=M[M.length-1], prev=M[M.length-2];
  S.tasks.filter(t=>!t.done).forEach(t=>{const d=diff(t.due),c=cl(t.cid);
    if(d<0)out.push({id:'tv'+t.id,sev:'crit',k:'t',tid:t.id,cid:t.cid,x:`Tarea vencida hace ${-d} d: ${t.txt}`,y:c?c.nombre:'Equipo'});
    else if(d===0)out.push({id:'th'+t.id+iso(0),sev:'warn',k:'t',tid:t.id,cid:t.cid,x:`Vence hoy: ${t.txt}`,y:c?c.nombre:'Equipo'});});
  S.clients.forEach(c=>{
    if(c.honv>0)out.push({id:'hv'+c.id,sev:'crit',k:'c',cid:c.id,x:`Honorarios pendientes: ${money(c.honv)}`,y:c.nombre});
    if(activeClient(c)){const n=since(c);
      if(n==null)out.push({id:'ln'+c.id,sev:'warn',k:'c',cid:c.id,x:'Prospecto sin primer contacto',y:c.nombre});
      else if(n>S.cfg.dias)out.push({id:'sc'+c.id+'_'+n,sev:'warn',k:'c',cid:c.id,x:`${n} días sin contacto`,y:c.nombre});}});
  S.lotes.filter(l=>l.est!=='Cerrado').forEach(l=>{const c=cl(l.cid),di=diff(l.ing+'-01'),dv=diff(l.ven+'-01');
    const y=`${c?c.nombre:''} · Lote ${l.id}`;
    if((l.est==='En pasto'||l.est==='En corral')&&l.margen<0)out.push({id:'lm'+l.id,sev:'crit',k:'l',cid:l.id,x:`En curso y no cubre el costo del capital: pierde ${money(-l.margen)} por cabeza`,y});
    if(l.est==='Planificado'&&di>=0&&di<=45&&l.margen<0)out.push({id:'li'+l.id,sev:'warn',k:'l',cid:l.id,x:`Ingresa en ${di} días con margen negativo (${money(l.margen)}/cab). Revisar antes de comprar`,y});
    if(l.est==='Planificado'&&di<0)out.push({id:'lp'+l.id,sev:'warn',k:'l',cid:l.id,x:`La fecha de ingreso (${ym(l.ing+'-01')}) ya pasó y el lote no ingresó`,y});
    if((l.est==='En corral'||l.est==='En pasto')&&dv>=0&&dv<=45)out.push({id:'lv'+l.id,sev:'info',k:'l',cid:l.id,x:`Venta prevista ${ym(l.ven+'-01')}: faltan ${dv} días`,y});});
  if(last){const d=derived(last);
    if(d.ratio>S.cfg.ratio)out.push({id:'mr'+last.f,sev:'warn',k:'m',x:`Relación invernada/gordo en ${dec(d.ratio)}: reposición cara (umbral ${dec(S.cfg.ratio)})`,y:'Mercado'});
    if(d.kgMaiz<S.cfg.maiz)out.push({id:'mm'+last.f,sev:'warn',k:'m',x:`El gordo compra ${dec(d.kgMaiz,1)} kg de maíz, debajo del umbral de ${S.cfg.maiz} kg`,y:'Mercado'});
    if(prev){const v=last.gor/prev.gor-1;if(Math.abs(v)>=.05)out.push({id:'mv'+last.f,sev:'info',k:'m',x:`El gordo ${v>0?'subió':'bajó'} ${pct(Math.abs(v))} en el mes`,y:'Mercado'});}}
  const neg=forrajeBal().filter(f=>f[1]<0);
  if(neg.length){const mn=neg.reduce((a,b)=>b[1]<a[1]?b:a);
    out.push({id:'fo'+neg.length,sev:'warn',k:'f',x:`Déficit de forraje (recurso 1) de ${ym(neg[0][0]+'-01')} a ${ym(neg[neg.length-1][0]+'-01')}. Pico en ${ym(mn[0]+'-01')}: ${Math.round(mn[1]).toLocaleString('es-AR')} kg MS`,y:'Calendario del sistema'});}
  realDevs().forEach(d=>{if(d.dev<-S.cfg.desv)out.push({id:'rg'+d.b.id+'_'+d.m+'_'+d.v,sev:'warn',k:'r',x:`GDPV real de ${MES[d.m]}: ${dec(d.v)} kg/día contra ${dec(d.g)} del modelo (${pct(d.dev,0)}). Los lotes proyectados están sobrestimados`,y:d.b.n});});
  S.lotes.filter(l=>l.est==='Cerrado'&&l.real).forEach(l=>{const r=realCalc(l);if(r.dif<-50000)out.push({id:'rc'+l.id,sev:'info',k:'r',x:`Cerró ${money(-r.dif)} por cabeza debajo de lo que proyectaba el modelo`,y:`${cl(l.cid)?.nombre||''} · Lote ${l.id}`});});
  S.rac.forEach((r,i)=>{const c=racCalc(r);if(Math.abs(c.sum-1)>.001)out.push({id:'ra'+i+'_'+c.sum.toFixed(3),sev:'warn',k:'k',x:`La ración "${r.n}" suma ${pct(c.sum,0)} y debe sumar 100%`,y:'Dietas'})});
  S.rec.forEach((r,i)=>{if(r.pasto&&r.ha>0){const sm=r.perfil.reduce((a,b)=>a+b,0);if(Math.abs(sm-100)>.5)out.push({id:'rp'+i+'_'+sm,sev:'warn',k:'k',x:`El perfil mensual de "${r.n}" suma ${sm}% y debe dar 100`,y:'Costo del forraje'})}});
  const o={crit:0,warn:1,info:2};
  return out.filter(a=>!S.dismissed.includes(a.id)).sort((a,b)=>((UI.later||[]).includes(a.id)-(UI.later||[]).includes(b.id))||o[a.sev]-o[b.sev]);
}

/* ---------- gráficos ---------- */
function lineSVG(labels,series,fmt){
  const W=640,H=250,l=58,r=16,t=16,b=28;
  const all=series.flatMap(s=>s.v);let mn=Math.min(...all),mx=Math.max(...all);const pad=(mx-mn||1)*.15;mn-=pad;mx+=pad;
  const X=i=>l+i*(W-l-r)/Math.max(labels.length-1,1), Y=v=>t+(1-(v-mn)/(mx-mn))*(H-t-b);
  let g='';for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);g+=`<line class="gl" x1="${l}" x2="${W-r}" y1="${y}" y2="${y}"/><text x="${l-8}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`}
  g+=labels.map((s,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${s}</text>`).join('');
  g+=`<line class="ax" x1="${l}" x2="${W-r}" y1="${H-b}" y2="${H-b}"/>`;
  series.forEach(s=>{g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2.5" points="${s.v.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`+
    s.v.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===s.v.length-1?5:3.5}" fill="${s.c}"><title>${labels[i]} · ${s.n}: ${fmt(v)}</title></circle>`).join('')});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function barSVG(rows,fmt){
  const W=640,H=230,l=58,r=16,t=16,b=28,mx=Math.max(...rows.map(x=>Math.abs(x[1])))*1.1,zero=t+(H-t-b)/2;
  const bw=(W-l-r)/rows.length;
  let g=`<line class="gl" x1="${l}" x2="${W-r}" y1="${t}" y2="${t}"/><text x="${l-8}" y="${t+4}" text-anchor="end">+${fmt(mx)}</text><text x="${l-8}" y="${H-b+4}" text-anchor="end">−${fmt(mx)}</text>`;
  rows.forEach((x,i)=>{const h=Math.abs(x[1])/mx*(H-t-b)/2,y=x[1]>=0?zero-h:zero;
    g+=`<rect x="${l+i*bw+4}" y="${y}" width="${bw-8}" height="${Math.max(h,1)}" fill="${x[1]>=0?'var(--green)':'var(--red)'}"><title>${ym(x[0]+'-01')}: ${fmt(x[1])} kg MS</title></rect><text x="${l+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${ym(x[0]+'-01').slice(0,3)}</text>`});
  g+=`<line class="ax" x1="${l}" x2="${W-r}" y1="${zero}" y2="${zero}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

const GPTS=[[-.2,-137562],[-.1,-61693],[0,0],[.1,51299],[.2,94396]];
function simVal(l){
  const dg=UI.sim.dg,dp=UI.sim.dp;let v=0;
  for(let i=0;i<GPTS.length-1;i++){const [a,fa]=GPTS[i],[b,fb]=GPTS[i+1];if(dg>=a-1e-9&&dg<=b+1e-9){v=fa+(fb-fa)*(dg-a)/(b-a);break}}
  v*=(l.pf-l.pi)/225;
  const pr=17129*(dp*100)*(l.pv*l.pf)/(4821.05*400);
  return v+pr;
}

function parseCSV(t){const r=[];let row=[],f='',q=false;t=t.replace(/^﻿/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===','||ch===';'){row.push(f);f=''}
    else if(ch==='\n'){row.push(f);r.push(row);row=[];f=''}else if(ch!=='\r')f+=ch}
  if(f||row.length){row.push(f);r.push(row)}return r}

function bindDeck(){

/* ---------- ANÁLISIS: Calendario, Sensibilidad, Comparador, Curva ---------- */
function colsSVG(vals,labels,fmt,color){
  const W=640,H=220,l=62,r=14,t=16,b=28,mx=Math.max(...vals)*1.1||1,bw=(W-l-r)/vals.length;
  let g=`<line class="gl" x1="${l}" x2="${W-r}" y1="${t}" y2="${t}"/><text x="${l-8}" y="${t+4}" text-anchor="end">${fmt(mx)}</text><line class="ax" x1="${l}" x2="${W-r}" y1="${H-b}" y2="${H-b}"/>`;
  vals.forEach((v,i)=>{const h=v/mx*(H-t-b);g+=`<rect x="${l+i*bw+5}" y="${H-b-h}" width="${bw-10}" height="${Math.max(h,1)}" rx="6" fill="${color}"><title>${labels[i]}: ${fmt(v)}</title></rect><text x="${l+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`}
function vAnalisis(){
  const tabs=[['cal','Calendario'],['sens','Sensibilidad'],['comp','Comparador'],['curva','Curva de precios']];
  return `<h1>Análisis</h1><p class="sub">Las hojas Calendario, Sensibilidad, Comparador y Curva del modelo.</p>
  <div class="segsub">${tabs.map(([k,n])=>`<button class="${UI.atab===k?'on':''}" data-act="atab" data-v="${k}">${n}</button>`).join('')}</div>
  ${UI.atab==='cal'?tCal():UI.atab==='sens'?tSens():UI.atab==='comp'?tComp():tCurva()}`;
}

  <div class="cols"><div><h2>Cabezas en pasto y en corral</h2><div class="legend"><span><i style="background:#15b374"></i>En pasto</span><span><i style="background:#f0452b"></i>En corral</span></div>
  ${lineSVG(lab,[{n:'En pasto',c:'#15b374',v:C.pasto},{n:'En corral',c:'#f0452b',v:C.corral}],v=>Math.round(v))}</div>
  <div><h2>Capital empleado (millones de $)</h2>${colsSVG(C.cap,lab,v=>'$'+Math.round(v)+' M','#2f8cff')}</div></div>
  <div class="sec"><div class="tablewrap"><table><thead><tr><th>Mes</th><th class="num">Cabezas en pasto</th><th class="num">Cabezas en corral</th><th class="num">Balance de alfalfa (kg MS)</th><th class="num">Capital empleado</th></tr></thead><tbody>
  ${C.meses.map((m,i)=>`<tr><td>${ym(m+'-01')}</td><td class="num">${dec(C.pasto[i],1)}</td><td class="num">${dec(C.corral[i],1)}</td><td class="num ${bal[i][1]<0?'crit':'ok'}">${Math.round(bal[i][1]).toLocaleString('es-AR')}</td><td class="num">${short(C.cap[i]*1e6)}</td></tr>`).join('')}</tbody></table></div></div>`}
const SENS_G=[[-.2,-49104,247,.136],[-.1,26765,222,.249],[0,88458,202,.397],[.1,139756,185,.47],[.2,182854,171,.7]],SENS_P=[[-8,-48574,.134],[0,88458,.397],[8,225490,.689]];
function simAt(l,dg,dp){let v=0;for(let i=0;i<GPTS.length-1;i++){const[a,fa]=GPTS[i],[b,fb]=GPTS[i+1];if(dg>=a-1e-9&&dg<=b+1e-9){v=fa+(fb-fa)*(dg-a)/(b-a);break}}
  return v*(l.pf-l.pi)/225+17129*(dp*100)*(l.pv*l.pf)/(4821.05*400)}
function tSens(){
  const ls=S.lotes.filter(l=>l.est!=='Cerrado'),l=lo(UI.slote)||ls[0],ex=l.id===1,k=(l.pf-l.pi)/225,pk=(l.pv*l.pf)/(4821.05*400);

  const pr=ex?SENS_P.map(r=>row(r[0]===0?'<b>Base</b>':`Precio de venta ${r[0]>0?'+':'−'}8%`,r[1],r[1]-88458,null,r[2])):[-.08,0,.08].map(d=>{const dl=simAt(l,0,d);return row(d===0?'<b>Base</b>':`Precio de venta ${d>0?'+':'−'}8%`,l.margen+dl,dl,null,null)});
  return `<div class="bar"><label class="label">Lote base <select data-act="slote">${ls.map(x=>`<option value="${x.id}" ${x.id===l.id?'selected':''}>Lote ${x.id} · ${esc(x.nombre)}</option>`).join('')}</select></label></div>

  <div class="kpis4" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px">
   <div class="tile" style="cursor:default"><small>Valor de +100 g/día de GDPV</small><b>${money(56496*k)}</b><small>por cabeza, en todas las etapas</small></div>
   <div class="tile" style="cursor:default"><small>Valor de 1 % de precio de venta</small><b>${money(17129*pk)}</b><small>por cabeza</small></div></div>
  <h2>Cambios de GDPV</h2><div class="tablewrap"><table><thead><tr><th>Variación</th><th class="num">Margen después de financiar</th><th class="num">Diferencia</th><th class="num">Días</th><th class="num">TIR</th></tr></thead><tbody>${gr.join('')}</tbody></table></div>
  <h2 class="sec">Cambios de precio de venta</h2><div class="tablewrap"><table><thead><tr><th>Variación</th><th class="num">Margen después de financiar</th><th class="num">Diferencia</th><th class="num">Días</th><th class="num">TIR</th></tr></thead><tbody>${pr.join('')}</tbody></table></div>`}
function compT(title,rows,pesoLab){const best=Math.max(...rows.map(r=>r[2]));
  return `<h2 class="sec">${title}</h2><div class="tablewrap"><table><thead><tr><th>Alt.</th><th class="num">${pesoLab}</th><th class="num">Δ vs base</th><th class="num">Margen después de financiar</th><th class="num">Días</th><th class="num">Margen por día</th><th class="num">TIR</th><th class="num">Costo directo $/kg</th><th class="num">Precio de equilibrio</th><th class="num">Colchón</th><th class="num">Margen por día extra</th></tr></thead><tbody>
  ${rows.map((r,i)=>`<tr class="${r[2]===best?'best':''}"><td>${i+1}${r[2]===best?' ◄':''}</td><td class="num">${r[0]} kg</td><td class="num">${r[1]>0?'+':''}${r[1]}</td><td class="num ${r[2]>=0?'ok':'crit'}">${money(r[2])}</td><td class="num">${Math.round(r[3])}</td><td class="num">${money(r[4])}</td><td class="num">${pct(r[5],1)}</td><td class="num">${money(r[6])}</td><td class="num">${money(r[7])}</td><td class="num ${r[8]>=0?'ok':'crit'}">${pct(r[8],1)}</td><td class="num">${r[9]==null?'—':money(r[9])}</td></tr>`).join('')}</tbody></table></div>`}

  <div id="msgs">${(C.msgs[C.ch]||[]).map(m=>{const l=m.lid&&lo(m.lid),c=m.cid&&cl(m.cid);return `<div class="m ${m.a===ME?'me':''}"><small>${m.a===ME?'Vos':esc(m.a)} · ${hhmm(m.t)}</small><div class="bub">${esc(m.x)}${l?`<br><button class="chipref" data-act="openLote" data-id="${l.id}">Lote ${l.id} · TIR ${pct(l.tir,0)}</button>`:''}${c?`<br><button class="chipref" data-act="open" data-id="${c.id}">${esc(c.nombre)}</button>`:''}</div></div>`}).join('')||'<div class="empty">Escribí el primer mensaje.</div>'}</div>
  <div class="typ">${UI.typing&&UI.typing.ch===C.ch?esc(UI.typing.who)+' está escribiendo…':''}</div>
  <form class="cin" id="cform"><select id="cref" style="max-width:110px"><option value="">Vincular…</option><optgroup label="Productores">${S.clients.map(c=>`<option value="c${c.id}">${esc(c.nombre)}</option>`).join('')}</optgroup><optgroup label="Lotes">${S.lotes.map(l=>`<option value="l${l.id}">Lote ${l.id}</option>`).join('')}</optgroup></select><input id="cmsg" placeholder="Mensaje…" autocomplete="off"><button class="btn pri" style="padding:10px 14px">${ico('send',18,2)}</button></form>`;
  const e=$('#msgs');if(e)e.scrollTop=1e9;if(C.unread[C.ch]&&UI.chat){delete C.unread[C.ch];shell()}}
function pushMsg(ch,a,x,ref){const C=S.chat;(C.msgs[ch]=C.msgs[ch]||[]).push({a,t:Date.now(),x,...(ref||{})});
  if(a!==ME&&!(UI.chat&&C.ch===ch)){C.unread[ch]=(C.unread[ch]||0)+1;toast(x.slice(0,70),'info',a,()=>{S.chat.ch=ch;toggleChat(true)})}}
function sendChat(x,ref){const ch=S.chat.ch;pushMsg(ch,ME,x,ref);chatR();save()}
function toggleChat(v){UI.chat=v??!UI.chat;$('#chat').classList.toggle('on',UI.chat);chatR();if(UI.chat)setTimeout(()=>{const i=$('#cmsg');i&&i.focus()},300)}

/* ---------- barra de comandos ---------- */
function cmdItems(q){q=q.trim().toLowerCase();
  const go=(m,extra)=>()=>{if(extra)extra();setMode(m)};
  const acts=[['Ir a Hoy','sun',go('hoy')],['Ir al Ciclo','cal',go('ciclo')],['Ir a Productores','people',go('gente')],['Ir a Mercado','chart',go('mercado')],['Ir a Costos y dietas','wheat',go('costos')],['Ir a Real vs modelo','scale',go('real')],['Ir a Análisis','grid',go('analisis')],
   ['Costo del forraje','wheat',go('costos',()=>UI.ctab='forraje')],['Dietas y raciones','wheat',go('costos',()=>UI.ctab='dietas')],['Biblioteca de etapas','wheat',go('costos',()=>UI.ctab='biblioteca')],
   ['Calendario','grid',go('analisis',()=>UI.atab='cal')],['Sensibilidad','grid',go('analisis',()=>UI.atab='sens')],['Comparador','grid',go('analisis',()=>UI.atab='comp')],['Curva de precios','grid',go('analisis',()=>UI.atab='curva')],
   ['Ver los pendientes','bell',()=>openDrawer('a')],['Nuevo productor','plus',newClient],['Nuevo lote','plus',()=>editLote()],['Nueva tarea','plus',()=>newTask()],['Cargar precios del mes','chart',newPrecio],['Cargar un lote cerrado','scale',()=>closeLote()],['Abrir el chat','chat',()=>toggleChat(true)]];
  const A=acts.filter(a=>!q||a[0].toLowerCase().includes(q)).map(a=>({g:'Ir a / acciones',t:a[0],i:a[1],f:a[2]}));
  const Cs=q?S.clients.filter(c=>[c.nombre,c.titular,c.zona].join(' ').toLowerCase().includes(q)).map(c=>({g:'Productores',t:c.nombre,i:'people',tag:c.zona,f:()=>openDrawer('c',c.id)})):[];
  const Ls=q?S.lotes.filter(l=>('lote '+l.id+' '+l.nombre+' '+(cl(l.cid)?.nombre||'')).toLowerCase().includes(q)).map(l=>({g:'Lotes',t:`Lote ${l.id} · ${l.nombre}`,i:'cow',tag:cl(l.cid)?.nombre,f:()=>openDrawer('l',l.id)})):[];
  return [...Cs,...Ls,...A].slice(0,10)}
function cmdR(){const q=$('#q').value,it=UI.items=cmdItems(q);UI.sel=Math.min(UI.sel,Math.max(it.length-1,0));let g='';
  $('#res').innerHTML=it.map((x,i)=>(x.g!==g?(g=x.g,`<h6>${g}</h6>`):'')+`<button class="${i===UI.sel?'sel':''}" data-ci="${i}">${ico(x.i,19)}${esc(x.t)}<span class="tag">${esc(x.tag||'')}</span></button>`).join('')||'<div class="empty">No encontré nada. Probá con otro nombre.</div>';
  $('#res').classList.add('on')}
function runCmd(i){const x=UI.items[i];if(!x)return;$('#res').classList.remove('on');$('#q').value='';$('#q').blur();x.f()}

/* ---------- eventos ---------- */
$('#av').innerHTML=ico('people',22,2);$('#lg').innerHTML=ico('cow',22,2.2);$('#si').innerHTML=ico('search',22);
$('#q').addEventListener('input',()=>{UI.sel=0;cmdR()});
$('#q').addEventListener('focus',cmdR);
$('#q').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){UI.sel=Math.min(UI.sel+1,UI.items.length-1);cmdR();e.preventDefault()}else if(e.key==='ArrowUp'){UI.sel=Math.max(UI.sel-1,0);cmdR();e.preventDefault()}else if(e.key==='Enter')runCmd(UI.sel);else if(e.key==='Escape'){$('#res').classList.remove('on');$('#q').blur()}});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus();return}
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||$('#dlg').open)return;
  if(e.key==='Escape')closeDrawer();
  if(UI.view==='hoy'){const el=document.querySelector('.acard.top');if(el&&e.key==='ArrowRight')fly(el,1,'adis');if(el&&e.key==='ArrowLeft')fly(el,-1,'alater');if(el&&e.key==='Enter')topAct('agoal')}});
document.addEventListener('click',e=>{const t=e.target;
  if(!t.closest('.cmd'))$('#res').classList.remove('on');
  let b;
  if(b=t.closest('[data-ci]'))return runCmd(+b.dataset.ci);
  if(b=t.closest('[data-m]'))return setMode(b.dataset.m);
  if(t.closest('#bellb'))return openDrawer('a');
  if(t.closest('#fab'))return toggleChat();
  if(t.closest('#ov'))return closeDrawer();
  if(b=t.closest('[data-ch]')){S.chat.ch=b.dataset.ch;UI.typing=null;return chatR()}
  b=t.closest('[data-act]');if(!b||b.matches('select,form,textarea')||(b.tagName==='INPUT'&&b.type!=='checkbox'))return;
  const a=b.dataset.act,id=+b.dataset.id;
  if(a==='go'){const v=b.dataset.v;return setMode(v)}
  if(a==='open'){e.stopPropagation();return openDrawer('c',id)}
  if(a==='openLote'){e.stopPropagation();return openDrawer('l',id)}
  if(a==='closeDrawer')return closeDrawer();
  if(a==='tog'){const k=S.tasks.find(x=>x.id===id);k.done=b.checked;if(k.done){S.resolved++;log(`${ME} completó: ${k.txt}`)}return render()}
  if(a==='agoal'||a==='alater'||a==='adis')return topAct(a);
  if(a==='aone'){const al=alerts().find(x=>x.id===b.dataset.id);if(al){closeDrawer();goAlert(al)}return}
  if(a==='alist')return openDrawer('a');
  if(a==='dismiss'){S.dismissed.push(b.dataset.id);S.resolved++;return render()}
  if(a==='cview'){UI.cview=b.dataset.v;return render()}
  if(a==='atab'){UI.atab=b.dataset.v;return render()}
  if(a==='ctab'){UI.ctab=b.dataset.v;return render()}
  if(a==='serie'){UI.serie=b.dataset.v;return render()}
  if(a==='stage'){UI.stage=b.dataset.v;return render()}
  if(a==='sort'){const k=b.dataset.k;UI.dir=UI.sort===k?-UI.dir:1;UI.sort=k;return render()}
  if(a==='newClient')return newClient();
  if(a==='newLote')return editLote();
  if(a==='editLote')return editLote(id);
  if(a==='closeLote')return closeLote(id||null);
  if(a==='lotesCsv')return lotesCsv();
  if(a==='newPrecio')return newPrecio();
  if(a==='newTask')return newTask(b.dataset.id);
  if(a==='csvOut')return csvOut();
  if(a==='csvIn')return $('#file').click();
  if(a==='curvaAdd'){S.curva.push([S.curva[S.curva.length-1][0]+40,S.curva[S.curva.length-1][1]]);return render()}
  if(a==='curvaDel'){if(S.curva.length>2)S.curva.splice(id,1);return render()}
  if(a==='contacted'){const c=cl(id);c.ultimo=iso(0);c.hist.push({d:iso(0),t:'Contacto registrado'});if(c.etapa==='Prospecto')c.etapa='Diagnóstico';log(`${ME} registró contacto con ${c.nombre}`);S.seen=[];toast('Contacto registrado','ok',c.nombre);return render()}
  if(a==='share'){const ref=b.dataset.id;S.chat.ch=ref[0]==='l'?'lotes':'general';closeDrawer();toggleChat(true);setTimeout(()=>{$('#cref').value=ref;$('#cmsg').value='Mírenlo cuando puedan: ';$('#cmsg').focus()},350);return}
  if(a==='logout'){SYNC.on=false;try{localStorage.removeItem(KEY)}catch(e){}sb.auth.signOut().then(()=>location.reload());return}
  if(a==='reset'){if(confirm('¿Borrar todo lo que cargaste y volver a los datos del Excel?')){S=seed();S.resolved=0;UI.later=[];closeDrawer();render();chatR();toast('Datos restablecidos','info','Listo')}}
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act;
  if(t.dataset.tog){const k=S.tasks.find(x=>x.id==t.dataset.tog);k.done=t.checked;if(k.done){S.resolved++;log(`${ME} completó: ${k.txt}`);toast('Tarea hecha')}return render()}
  if(a==='cfg'){S.cfg[t.dataset.k]=+t.value;S.dismissed=[];render()}
  else if(a==='slote'){UI.slote=+t.value;render()}
  else if(a==='realCell'){const b=t.dataset.b;(S.real[b]=S.real[b]||{})[t.dataset.m]=t.value===''?undefined:+t.value;if(t.value==='')delete S.real[b][t.dataset.m];render()}
  else if(a==='cset'){let v=t.dataset.s?t.value:(t.value===''?0:+t.value);if(t.dataset.pc)v/=100;setPath(t.dataset.p,v);render()}
  else if(a==='mkt'){S.ins[0].mkt=t.checked;render()}
  else if(a==='bsrc'){S.bib[+t.dataset.i].src=t.value==='m'?null:t.value;render()}
  else if(a==='ccm'){UI.cc.mes=+t.value;render()}
  else if(a==='stageSel')moveStage(+t.dataset.id,t.value);
  else if(a==='lstateSel')moveLote(+t.dataset.id,t.value);
});
document.addEventListener('input',e=>{
  if(e.target.id==='ccp'){UI.cc.peso=+e.target.value;$('#ccpl').textContent=UI.cc.peso+' kg';$('#cct').innerHTML=ccTable();return}
  if(e.target.id==='rdg'){UI.sim.dg=+e.target.value;updSim()}else if(e.target.id==='rdp'){UI.sim.dp=+e.target.value/100;updSim()}});
document.addEventListener('submit',e=>{const f=e.target;
  if(f.dataset.act==='noteForm'){e.preventDefault();const c=cl(+f.dataset.id),v=f.t.value.trim();if(!v)return;c.notas.push({d:iso(0),a:ME,t:v});c.hist.push({d:iso(0),t:'Nota agregada'});log(`${ME} agregó una nota en ${c.nombre}`);toast('Nota guardada');render()}
  else if(f.id==='cform'){e.preventDefault();const v=$('#cmsg').value.trim();if(!v)return;const r=$('#cref').value;$('#cmsg').value='';sendChat(v,r?(r[0]==='l'?{lid:+r.slice(1)}:{cid:+r.slice(1)}):null)}});
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>csvIn(r.result);r.readAsText(f);e.target.value=''};

/* ---------- arranque + evento en vivo ---------- */
render();chatR();


/* ---------- sincronización (Supabase) ---------- */
// Completá estos dos datos con los de tu proyecto de Supabase. Si quedan vacíos, la app funciona solo en este aparato.
const SUPA={url:'https://kyowmixxdoiohzmfvhpf.supabase.co',key:'sb_publishable_m5A6ucgIWhujD-uSGLMFjw_ChYJaM3t'};
let sb=null;
function syncStatus(t,c){const e=$('#sync');e.textContent=t;e.className='sync '+(c||'')}
async function pushNow(){
  if(!SYNC.on||SYNC.busy)return;SYNC.busy=true;SYNC.pending=false;syncStatus('Guardando…','wait');const now=new Date().toISOString();
  const {error}=await sb.from('rumbo_state').upsert({user_id:SYNC.user.id,data:S,updated_at:now});SYNC.busy=false;
  if(error){SYNC.pending=true;syncStatus('Sin conexión, reintento…','bad');setTimeout(pushNow,8000)}
  else{SYNC.last=Date.parse(now);if(SYNC.pending)queuePush();else syncStatus('Sincronizado')}}
function queuePush(){SYNC.pending=true;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushNow,1200)}
async function pull(first){
  if(!SYNC.on)return;const {data,error}=await sb.from('rumbo_state').select('data,updated_at').maybeSingle();
  if(error){syncStatus('Sin conexión','bad');return}
  if(!data){await pushNow();return}
  const rt=Date.parse(data.updated_at);
  if(first||(rt>SYNC.last+500&&!SYNC.pending&&!SYNC.busy&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&!$('#dlg').open)){
    S=data.data;SYNC.last=rt;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render();chatR();if(!first)toast('Se actualizaron tus datos desde otro aparato','info','Sincronizado')}
  syncStatus('Sincronizado')}
async function afterLogin(session){
  SYNC.user=session.user;SYNC.on=true;$('#login').classList.remove('on');syncStatus('Conectando…','wait');await pull(true);
  setInterval(()=>pull(false),15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull(false)});render()}
function startSync(){
  if(!SUPA.url||!SUPA.key||!window.supabase)return;
  sb=window.supabase.createClient(SUPA.url,SUPA.key);$('#lg2').innerHTML=ico('cow',22,2.2);
  const msg=(t,ok)=>{const m=$('#lmsg');m.textContent=t;m.className='lmsg'+(ok?' ok':'')};
  const ES={'Invalid login credentials':'El correo o la contraseña no coinciden.','User already registered':'Ese correo ya tiene cuenta. Probá entrar.','Email not confirmed':'Falta confirmar el correo. Revisá tu bandeja de entrada.'};
  $('#lform').onsubmit=async e=>{e.preventDefault();msg('Entrando…',true);const {data,error}=await sb.auth.signInWithPassword({email:$('#lmail').value.trim(),password:$('#lpass').value});
    if(error)msg(ES[error.message]||error.message);else afterLogin(data.session)};
  $('#lup').onclick=async()=>{const email=$('#lmail').value.trim(),password=$('#lpass').value;if(!email||password.length<6)return msg('Escribí tu correo y una contraseña de al menos 6 caracteres.');
    msg('Creando cuenta…',true);const {data,error}=await sb.auth.signUp({email,password});
    if(error)msg(ES[error.message]||error.message);else if(data.session)afterLogin(data.session);else msg('Te mandamos un correo para confirmar la cuenta. Confirmá y volvé a entrar.',true)};
  sb.auth.getSession().then(({data})=>{if(data.session)afterLogin(data.session);else $('#login').classList.add('on')})}
window.addEventListener('load',startSync);

/* ---------- aviso de versión nueva (no recarga sola y no toca la sesión) ---------- */
const VERSION_CARGADA=(document.querySelector('meta[name="app-version"]')||{}).content||'';
async function versionPublicada(){try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return null;return (await r.json()).v||null}catch(e){return null}}
// El aviso es fijo arriba: la página baja lo que mida el aviso (cambia con el ancho de la pantalla) para que no tape la cabecera.
function ajustarAviso(){const n=document.getElementById('nueva');document.body.style.paddingTop=n.classList.contains('on')?n.offsetHeight+'px':''}
window.addEventListener('resize',ajustarAviso);
function mostrarAvisoVersion(){document.getElementById('nueva').classList.add('on');ajustarAviso();avisoEnDialogo()}
// Con un formulario emergente abierto el resto de la página queda bloqueada: el aviso también va dentro del formulario.
function avisoEnDialogo(){const d=document.getElementById('dlg');
  if(!d||!d.open||!document.getElementById('nueva').classList.contains('on')||d.querySelector('.nueva-dentro'))return;
  const a=document.createElement('div');a.className='nueva-dentro';a.innerHTML='<b>Hay una versión nueva.</b><span>Terminá y guardá; después tocá Actualizar.</span><button type="button" class="btn lime sm">Actualizar</button>';
  a.querySelector('button').onclick=()=>location.reload();d.prepend(a)}
async function chequearVersion(){
  if(!VERSION_CARGADA||VERSION_CARGADA==='sin-estampar'||document.getElementById('nueva').classList.contains('on'))return;
  const v=await versionPublicada();if(v&&v!==VERSION_CARGADA)mostrarAvisoVersion()}
setInterval(chequearVersion,5*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)chequearVersion()});
window.addEventListener('focus',chequearVersion);
window.addEventListener('pageshow',e=>{if(e.persisted)chequearVersion()});   // pestaña recuperada de la memoria del navegador
setTimeout(chequearVersion,4000);
document.getElementById('nbtn').onclick=()=>location.reload();                // actualizar nunca toca la sesión
</script>
